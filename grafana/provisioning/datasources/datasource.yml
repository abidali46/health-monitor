apiVersion: 1

datasources:
  - name: PostgreSQL
    type: postgres
    uid: postgresql-system-health
    access: proxy
    url: db:5432
    user: ${POSTGRES_USER}
    database: ${POSTGRES_DB}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    isDefault: true
    editable: true
